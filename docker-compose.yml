services:
  postgres:
    image: postgres:17-alpine
    container_name: gymfree-postgres
    environment:
      POSTGRES_DB: gymfree
      POSTGRES_USER: gymfree
      POSTGRES_PASSWORD: gymfree-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymfree"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gymfree-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gymfree
      MINIO_ROOT_PASSWORD: gymfree-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
